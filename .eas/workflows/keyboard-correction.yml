name: member keyboard correction
jobs:
  build_ios:
    type: build
    env:
      EXPO_PUBLIC_APP_VARIANT: member
    params:
      platform: ios
      profile: member-testflight
  submit_ios:
    needs: [build_ios]
    type: submit
    env:
      EXPO_PUBLIC_APP_VARIANT: member
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: member-testflight

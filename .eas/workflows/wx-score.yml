name: AV8 FLY personalized WX score
on:
  workflow_dispatch: {}
jobs:
  build_ios:
    name: Build personalized weather scoring for iOS
    type: build
    params:
      platform: ios
      profile: production
  submit_ios:
    name: Upload WX score to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

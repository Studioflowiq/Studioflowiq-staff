name: management verified release 2026-11-05
jobs:
  release:
    type: build
    env:
      EXPO_PUBLIC_APP_VARIANT: management
    params:
      platform: ios
      profile: management-testflight
  upload:
    needs: [release]
    type: submit
    env:
      EXPO_PUBLIC_APP_VARIANT: management
    params:
      build_id: ${{ needs.release.outputs.build_id }}
      profile: management-testflight

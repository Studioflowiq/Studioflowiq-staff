appId: com.studioflowiq.members
---
- launchApp:
    clearState: true
- tapOn:
    id: field-member-email
- waitForAnimationToEnd
- inputText: keyboard.probe@example.com
- assertVisible: keyboard.probe@example.com
- takeScreenshot: email-entry
- tapOn: Continue
- tapOn:
    id: field-password
- waitForAnimationToEnd
- inputText: SimulatorOnly1234
- takeScreenshot: password-entry
- tapOn: Change email
- tapOn:
    id: field-member-email
- waitForAnimationToEnd
- inputText: "777"
- assertVisible:
    id: field-member-email
    text: ".*777.*"
- takeScreenshot: email-return
- tapOn: Continue
- tapOn:
    id: field-password
- waitForAnimationToEnd
- inputText: SecondTyping1234
- takeScreenshot: password-return
